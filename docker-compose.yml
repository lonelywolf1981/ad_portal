# Container logs: json-file without limits grew to GBs (nginx); keep 5 x 20 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  web:
    build: .
    container_name: ad_portal_web
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    expose:
      - "8000"
    networks:
      - adnet
    environment:
      - TZ=Asia/Almaty

  redis:
    image: redis:7-alpine
    container_name: ad_portal_redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - adnet

  worker:
    build: .
    container_name: ad_portal_worker
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      - redis
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "-l", "INFO", "--concurrency", "2", "--max-tasks-per-child", "1"]
    volumes:
      - ./data:/app/data
    networks:
      - adnet
    environment:
      - TZ=Asia/Almaty


  beat:
    build: .
    container_name: ad_portal_beat
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    depends_on:
      - redis
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "-l", "WARNING"]
    volumes:
      - ./data:/app/data
    networks:
      - adnet
    environment:
      - TZ=Asia/Almaty


  nginx:
    image: nginx:1.27-alpine
    container_name: ad_portal_nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - web
    ports:
      - "8484:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - adnet

volumes:
  redis_data:

networks:
  adnet:
    driver: bridge
