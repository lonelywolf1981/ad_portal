# Kerberos client config for host queries (WinRM/WMI/SMB to workstations as svc-hostquery).
# Tickets are requested by app/host_query/kerberos.py into a private credential cache.
[libdefaults]
    default_realm = UBC.LOCAL.NET
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    forwardable = false
    udp_preference_limit = 1

[realms]
    UBC.LOCAL.NET = {
        kdc = dc1.ubc.local.net
        kdc = dc2.ubc.local.net
    }

[domain_realm]
    .ubc.local.net = UBC.LOCAL.NET
    ubc.local.net = UBC.LOCAL.NET
