# Login brute-force limit: 10 attempts/min per client IP (+5 burst), then 429. conf.d is included in the
# http context, so the zone is declared here, outside server.
limit_req_zone $binary_remote_addr zone=adp_login:1m rate=10r/m;

server {
    # HTTPS only. The host publishes container port 443 as 8484, so plain http://…:8484 reaches this
    # TLS listener: nginx answers such requests with 497, redirected below to https on the same port.
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/adtools-fullchain.pem;   # JSQ Issuing CA, adtools.ubc.local.net + adtools.jsq.home
    ssl_certificate_key /etc/nginx/certs/adtools.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;

    error_page 497 =301 https://$host:8484$request_uri;

    client_max_body_size 20m;

    # Re-resolve the web container via Docker DNS: with a static proxy_pass nginx kept the old IP
    # after 'docker compose up' recreated only web, and answered 502 until nginx was restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream http://web:8000;

    # Security headers. Bootstrap/htmx are served from /static/vendor (no CDN): scripts, styles and
    # fonts only from this host. 'unsafe-inline' stays because templates still use inline <script>
    # and on*= handlers; 'unsafe-eval' because htmx hx-on evaluates code. Removing both needs the
    # templates' inline JS moved to static files.
    # Framing is allowed only for the admin's local dashboard (dashboard.jsq.home:8787 = 127.0.0.1
    # via hosts file). No X-Frame-Options: it cannot list an allowed origin, frame-ancestors does.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self' http://dashboard.jsq.home:8787 http://127.0.0.1:8787 http://localhost:8787 https://dashboard.jsq.home:8787; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass $web_upstream;

        # Host logon checks can take longer than default proxy timeouts.
        proxy_connect_timeout 10s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        send_timeout 240s;

        # $http_host keeps the :8484 port, so the app's CSRF check (Origin vs Host) matches.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # Real client address only: $proxy_add_x_forwarded_for keeps a client-supplied
        # X-Forwarded-For, which lets a client spoof the IP written to the audit log.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_http_version 1.1;
    }

    # PaperCut PIN codes from TS1 (hourly task) — the only API call that changes AD; own token.
    location = /api/v1/pager-sync/papercut {
        allow 192.168.66.12;
        deny all;
        client_max_body_size 1m;
        proxy_pass $web_upstream;
        proxy_read_timeout 120s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # Read-only JSON API for the infra agent (OpenClaw 192.168.66.30) — token checked by the app as well.
    location /api/ {
        allow 192.168.66.30;
        deny all;
        limit_req zone=adp_login burst=30 nodelay;
        limit_req_status 429;
        proxy_pass $web_upstream;
        proxy_read_timeout 120s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
    location ~ ^/login/(ad|local)$ {
        limit_req zone=adp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    # HTMX status poll every few seconds per open tab: keep it out of the access log.
    location = /net-scan/poll {
        access_log off;
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
