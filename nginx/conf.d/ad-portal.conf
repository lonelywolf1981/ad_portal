server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Security headers. CSP is limited to directives that do not touch scripts/styles
    # (templates still use inline scripts and CDN assets).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass http://web:8000;

        # Host logon checks can take longer than default proxy timeouts.
        proxy_connect_timeout 10s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        send_timeout 240s;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        # Real client address only: $proxy_add_x_forwarded_for keeps a client-supplied
        # X-Forwarded-For, which lets a client spoof the IP written to the audit log.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_http_version 1.1;
    }

    # HTMX status poll every few seconds per open tab: keep it out of the access log.
    location = /net-scan/poll {
        access_log off;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
