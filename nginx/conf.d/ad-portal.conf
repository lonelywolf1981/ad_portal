server {
    # HTTPS only. The host publishes container port 443 as 8484, so plain http://…:8484 reaches this
    # TLS listener: nginx answers such requests with 497, redirected below to https on the same port.
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/adtools-fullchain.pem;   # JSQ Issuing CA, adtools.ubc.local.net + adtools.jsq.home
    ssl_certificate_key /etc/nginx/certs/adtools.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;

    error_page 497 =301 https://$host:8484$request_uri;

    client_max_body_size 20m;

    # Re-resolve the web container via Docker DNS: with a static proxy_pass nginx kept the old IP
    # after 'docker compose up' recreated only web, and answered 502 until nginx was restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web_upstream http://web:8000;

    # Security headers. CSP is limited to directives that do not touch scripts/styles
    # (templates still use inline scripts and CDN assets).
    # Framing is allowed only for the admin's local dashboard (dashboard.jsq.home:8787 = 127.0.0.1
    # via hosts file). No X-Frame-Options: it cannot list an allowed origin, frame-ancestors does.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self' http://dashboard.jsq.home:8787 http://127.0.0.1:8787 http://localhost:8787 https://dashboard.jsq.home:8787; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        proxy_pass $web_upstream;

        # Host logon checks can take longer than default proxy timeouts.
        proxy_connect_timeout 10s;
        proxy_send_timeout 240s;
        proxy_read_timeout 240s;
        send_timeout 240s;

        # $http_host keeps the :8484 port, so the app's CSRF check (Origin vs Host) matches.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # Real client address only: $proxy_add_x_forwarded_for keeps a client-supplied
        # X-Forwarded-For, which lets a client spoof the IP written to the audit log.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_http_version 1.1;
    }

    # HTMX status poll every few seconds per open tab: keep it out of the access log.
    location = /net-scan/poll {
        access_log off;
        proxy_pass $web_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
